[project]
name = "multimcp"
version = "0.1.0"
description = "Observabilidad y FinOps para clientes OpenAI, Anthropic y Google Gen AI."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Alejo Fookes" }]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.9,<3",
    "httpx>=0.28,<1",
]

[project.optional-dependencies]
openai = ["openai>=3.51,<4"]
anthropic = ["anthropic>=2.8,<3"]
google = ["google-genai>=3.3,<4"]
all = ["multimcp[openai,anthropic,google]"]
dev = ["pytest>=8.3,<10", "ruff>=0.8,<1"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/multimcp"]
