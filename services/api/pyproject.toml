[project]
name = "multimcp-api"
version = "0.1.0"
description = "API de ingesta, FinOps, latencia, trazas y evaluación RAG para multiMCP."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Alejo Fookes" }]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "multimcp",
    "fastapi>=0.162,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.9,<3",
    "httpx>=0.28,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.24,<1", "ruff>=0.8,<1"]
judge = ["openai>=3.51,<4"]
bigquery = ["google-cloud-bigquery>=3.25,<4"]

[project.scripts]
multimcp-api = "multimcp_api.main:run"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/multimcp_api"]

[tool.hatch.build.targets.wheel.force-include]
"src/multimcp_api/eval/rubrics" = "multimcp_api/eval/rubrics"

[tool.uv.sources]
multimcp = { workspace = true }
