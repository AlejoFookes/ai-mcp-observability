[tool.uv.workspace]
members = ["sdks/*", "services/*"]

[dependency-groups]
dev = [
    "multimcp[openai]",
    "multimcp-proxy",
    "pytest>=8.3,<10",
    "ruff>=0.8,<1",
]

[tool.uv.sources]
multimcp = { workspace = true }
multimcp-proxy = { workspace = true }

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["apps"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.isort]
known-first-party = ["multimcp", "multimcp_proxy"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["ANN"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "-ra"]
testpaths = ["sdks", "services"]
