name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python from .python-version
        run: uv python install

      - name: Sync workspace from uv.lock
        run: uv sync --locked

      - name: Ruff
        run: uv run ruff check .

      - name: Pytest
        run: uv run pytest

  web:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Typecheck and build
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f apps/web/package.json ]; then
            echo "Frontend not scaffolded yet. Skipping until Milestone 4."
            exit 0
          fi
          cd apps/web
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
          npm run build
